name: Site and affiliate validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "style.css"
      - "home-v2.css"
      - "visit-*"
      - "site-runtime.js"
      - "offers.json"
      - "scripts/**"
      - "recovery-index-policy.json"
      - "sitemap.xml"
      - ".github/workflows/weekly-offer-check.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "style.css"
      - "home-v2.css"
      - "visit-*"
      - "site-runtime.js"
      - "offers.json"
      - "scripts/**"
      - "recovery-index-policy.json"
      - "sitemap.xml"
      - ".github/workflows/weekly-offer-check.yml"
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate local site and affiliate usage
        run: node scripts/validate-site.mjs

      - name: Test site and ticket safeguards
        run: node --test scripts/*.test.mjs

      - name: Verify affiliate and direct product destinations
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/validate-site.mjs --redirects-only
