name: Affiliate offer validation

on:
  pull_request:
    paths:
      - "**/*.html"
      - "offers.json"
      - "scripts/validate-site.mjs"
      - ".github/workflows/weekly-offer-check.yml"
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate local site and affiliate usage
        run: node scripts/validate-site.mjs

      - name: Verify every affiliate short-link destination
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/validate-site.mjs --redirects-only
